services:
    athera_webserver:
        image: nginx:alpine
        container_name: athera_webserver
        restart: unless-stopped
        ports:
            - "5300:80"
        volumes:
            - ./:/var/www/html
            - ./docker/local/nginx/:/etc/nginx/conf.d/
        networks:
            - athera_network
        depends_on:
            - athera_app

    athera_app:
        build:
            context: .
            dockerfile: docker/local/php/Dockerfile
        container_name: athera_app
        restart: unless-stopped
        user: "1000:1000"
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        networks:
            - athera_network
        environment:
            APP_ENV: dev
            APP_DEBUG: "1"
            DATABASE_URL: "mysql://${DB_USER:-athera}:${DB_PASSWORD:-athera}@athera_db:3306/${DB_NAME:-athera}?serverVersion=11.4.0-MariaDB&charset=utf8mb4"
            MESSENGER_TRANSPORT_DSN: "redis://athera_redis:6379/messages"
            REDIS_URL: "redis://athera_redis:6379"
        depends_on:
            athera_db:
                condition: service_healthy
            athera_redis:
                condition: service_healthy

    athera_db:
        image: mariadb:11.4
        container_name: athera_db
        restart: unless-stopped
        environment:
            MARIADB_DATABASE: ${DB_NAME:-athera}
            MARIADB_USER: ${DB_USER:-athera}
            MARIADB_PASSWORD: ${DB_PASSWORD:-athera}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        volumes:
            - athera_db_data:/var/lib/mysql
        networks:
            - athera_network
        ports:
            - "5301:3306"
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    athera_phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: athera_phpmyadmin
        restart: unless-stopped
        environment:
            - PMA_HOST=athera_db
            - PMA_PORT=3306
            - PMA_ARBITRARY=1
        ports:
            - "5302:80"
        networks:
            - athera_network
        depends_on:
            - athera_db

    athera_redis:
        image: redis:7.4-alpine
        container_name: athera_redis
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - athera_redis_data:/data
        networks:
            - athera_network
        ports:
            - "5303:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5

    # Messenger queue worker. Uncomment once the Symfony app exists, otherwise
    # it will crash-loop looking for bin/console.
    # athera_worker:
    #     build:
    #         context: .
    #         dockerfile: docker/local/php/Dockerfile
    #     container_name: athera_worker
    #     restart: unless-stopped
    #     user: "1000:1000"
    #     working_dir: /var/www/html
    #     command: ["php", "bin/console", "messenger:consume", "async", "-vv", "--time-limit=3600"]
    #     volumes:
    #         - ./:/var/www/html
    #     environment:
    #         APP_ENV: dev
    #         DATABASE_URL: "mysql://${DB_USER:-athera}:${DB_PASSWORD:-athera}@athera_db:3306/${DB_NAME:-athera}?serverVersion=11.4.0-MariaDB&charset=utf8mb4"
    #         MESSENGER_TRANSPORT_DSN: "redis://athera_redis:6379/messages"
    #     networks:
    #         - athera_network
    #     depends_on:
    #         athera_db:
    #             condition: service_healthy
    #         athera_redis:
    #             condition: service_healthy

networks:
    athera_network:
        driver: bridge

volumes:
    athera_db_data:
    athera_redis_data:
